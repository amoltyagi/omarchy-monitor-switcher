<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#faf9f6"/><stop offset="1" stop-color="#e9ede8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="25" flood-color="#26372f" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1800" height="1120" fill="url(#backdrop)"/>
  <ellipse cx="1200" cy="470" rx="760" ry="560" fill="url(#glow)"/>
  <g font-family="Liberation Sans, Arial, sans-serif">
    <text x="100" y="122" font-size="21" font-weight="700" letter-spacing="3" fill="#597069">MONITOR SWITCHER 3</text>
    <text x="94" y="270" font-size="98" font-weight="700" letter-spacing="-4" fill="#182321">Your desk.</text>
    <text x="94" y="372" font-size="98" font-weight="700" letter-spacing="-4" fill="#182321">In order.</text>
    <text x="100" y="432" font-size="26" fill="#63716c">A major redesign for Omarchy.</text>
    <g font-size="25" fill="#384c44">
      <circle cx="108" cy="535" r="4" fill="#6a8c7b"/><text x="132" y="543">Click to change settings.</text>
      <circle cx="108" cy="597" r="4" fill="#6a8c7b"/><text x="132" y="605">Switch displays on or off.</text>
      <circle cx="108" cy="659" r="4" fill="#6a8c7b"/><text x="132" y="667">Drag and snap into place.</text>
      <circle cx="108" cy="721" r="4" fill="#6a8c7b"/><text x="132" y="729">20-second Keep / Revert.</text>
      <circle cx="108" cy="783" r="4" fill="#6a8c7b"/><text x="132" y="791">More shortcuts. Less clutter.</text>
    </g>
    <text x="100" y="1015" font-size="18" letter-spacing="1.5" fill="#7a8981">YOUR DISPLAYS. ONE PLACE.</text>
  </g>
  <image x="640" y="204" width="1060" height="720" preserveAspectRatio="xMidYMid meet" filter="url(#shadow)" xlink:href="screenshots/displays.png"/>
</svg>
